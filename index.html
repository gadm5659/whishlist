<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lista de deseos del grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo app de celular (máx. 480px), cabecera fija, contenido que scrollea, barra de pestañas abajo. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --tint:#E6ECE6; --ink:#14211C; --muted:#5A6962; --line:#D9E0DA;
  --accent:#B91C55; --accent-ink:#FFFFFF; --ok:#1B7F4F; --warn:#9A5F08;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18221D; --tint:#212D27; --ink:#EAF0EC; --muted:#9AA9A1; --line:#2B3832;
    --accent:#F2608F; --accent-ink:#22060F; --ok:#62CC96; --warn:#E6B257; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221D; --tint:#212D27; --ink:#EAF0EC; --muted:#9AA9A1; --line:#2B3832;
  --accent:#F2608F; --accent-ink:#22060F; --ok:#62CC96; --warn:#E6B257; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.15rem;font-weight:600}
p{margin:0}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.demo{background:var(--ink);color:var(--bg);padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:.85rem}
.demo label{flex:1;min-width:0}
.demo select,.demo input{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 8px;font-weight:700}
main{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;background:none;border:0;padding:12px 4px 14px;font-weight:600;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:600;align-self:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
button.card{text-align:left;width:100%;display:flex;align-items:center;gap:12px}
.date{flex:none;width:52px;text-align:center;background:var(--tint);border-radius:10px;padding:6px 0;line-height:1.05}
.date b{display:block;font-family:var(--display);font-size:1.35rem}
.date span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grow{flex:1;min-width:0}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{flex-direction:column;align-items:flex-start !important;gap:8px !important}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff}
.av.lg{width:52px;height:52px;font-size:1.3rem}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px solid currentColor}
.pill.free{color:var(--ok)} .pill.res{color:var(--warn)} .pill.done{color:var(--muted);border-style:dashed}
.item{display:flex;gap:12px}
.thumb{flex:none;width:72px;height:72px;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;font-weight:800;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item h3{font-family:var(--body);font-size:1rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.item a{color:var(--accent);font-weight:600;font-size:.88rem}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%;padding:12px}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--surface);text-decoration:none;text-align:center;display:block}
.note{background:var(--tint);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.note b{display:block}
.sz{font-weight:700}.warnt{color:var(--warn);font-weight:700}[hidden]{display:none !important}
.reveal{text-align:center;padding:22px 14px;border:2px dashed var(--accent)}
.reveal .name{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
.field input,.field textarea,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:400;font-size:1rem;width:100%}
pre.msg{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);background:var(--tint);border-radius:10px;padding:12px;margin:0;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:9;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.demo .btn{padding:4px 10px;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <div class="demo" id="bar" hidden><span class="grow" id="who"></span><button class="btn" data-act="logout">Salir</button></div>
  <main id="main"><p class="muted">Cargando las listas…</p></main>
  <nav class="tabs" id="tabs" aria-label="Secciones" hidden>
    <button data-act="go" data-v="home">Inicio</button>
    <button data-act="go" data-v="mine">Mi lista</button>
    <button data-act="go" data-v="gifts">Mis regalos</button>
  </nav>
</div>
<div id="overlay"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,getDoc,addDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,runTransaction,arrayUnion,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDNWVHa62waTsZ1EQ6zbH1D09OORzeKQ0E",
  authDomain:"wishlist-76179.firebaseapp.com",
  projectId:"wishlist-76179",
  storageBucket:"wishlist-76179.firebasestorage.app",
  messagingSenderId:"394258007246",
  appId:"1:394258007246:web:427abd6d5a0906a1fb7c9f"
};
const db=getFirestore(initializeApp(firebaseConfig));

const GROUP='Make Vzla Great Again';
const ADMIN='gustavo';
const PAL=['#B91C55','#1B6F8F','#7A4FB5','#B4610E','#1B7F4F','#4B5A8C','#8C3B3B','#2F7D7A'];
const SEED_USERS=[['Ricardo','23/01'],['Johemi','01/03'],['Fernando','16/04'],['Steven','15/05'],['Luis','05/06'],['Gustavo','28/07'],['Nestor','30/07'],['Francis','02/09'],['Freddy','21/09'],['Miche','29/09'],['Nelo','01/10'],['Leli','16/10'],['Mariana','07/11'],['Cristina','08/11'],['Daniela','23/11']];
const AA='https://amoramarilloaccesorios.com.ar/producto/';
const SEED_ITEMS=[
 ['Zapatillas Asics Skyhand','https://www.asics.com.ar/1203a452-750-zapatilla-asics-skyhand-og-u-1/p?skuId=6607','Amarillas','37'],
 ['Zapatillas Adidas Adistar Control 5','https://www.adidas.com.ar/zapatillas-adistar-control-5/KI4470.html','',''],
 ['Tote bag negra','https://www.ligero.com.ar/productos/tote-bag-negra/',''],
 ['Tote bag oliva','https://www.ligero.com.ar/productos/tote-bag-verde-oliva/',''],
 ['Tote bag Nara','https://www.ligero.com.ar/productos/tote-bag-nara-mxwsy/',''],
 ['Tote bag Huitral','https://www.huitralmochilas.com.ar/productos/combo-tote-tote-bag-cartu-aldcx/','Cualquier color menos rosa claro, fucsia y rojo, porque no tienen cierre'],
 ['Cuaderno Paperblanks','https://www.paperblanks.com.ar/cuadernos?Tama%C3%B1o=Ultra&mpage=3','Tamaño Ultra (18x23). Cualquier modelo lindo, sin caras ni cosas escritas en la tapa'],
 ['Rollos para cámara analógica, pack de 3','https://tienda.c41.com.ar/producto/kodak-gold-200-36-exp-3-pack-35mm/','Pueden comprarlo en otra tienda. El modelo del rollo tiene que ser este'],
 ['Collar Mini Tierno',AA+'mini-tierno/',''],
 ['Collar Verbena Mediano Cuarzo Citrino',AA+'verbenamedianocitrino/',''],
 ['Collar Caramelo',AA+'caramelo/',''],
 ['Collar Mousse',AA+'mousse/',''],
 ['Collar Victoria Ojo de tigre',AA+'victoria-ojo-de-tigre/',''],
 ['Jeans','','',''],['Pañuelos para el cabello','',''],['Sets de aritos para las orejas','','']];

let U=[],items=[],custom=[],ready={u:false,i:false,e:false},err='';
let me='';try{me=localStorage.getItem('wl_me')||''}catch(e){}
let view={v:'home'},photo='',showAll=false,sizedTouched=false,sizeFor=null,pinFor=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=id=>U.find(u=>u.id===id)||{id,n:'Alguien',c:'#777',b:'01/01'};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
function today(){const t=new Date();t.setHours(0,0,0,0);return t}
const dparts=d=>{const [y,m,dd]=String(d).split('-').map(Number);return {d:dd,m:MES[m-1]||'',date:new Date(y,m-1,dd)}};
const daysTo=d=>Math.round((dparts(d).date-today())/864e5);
const when=d=>{const n=daysTo(d);return n>1?'Faltan '+n+' días':n===1?'Es mañana':n===0?'Es hoy':'Ya pasó'};
const av=(id,lg)=>{const u=user(id);return `<span class="av${lg?' lg':''}" style="background:${u.c}" aria-hidden="true">${esc(u.n[0])}</span>`};
const listOf=id=>items.filter(i=>i.owner===id&&!i.removed);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const safeImg=s=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s||'')?s:'';
function nextMD(b){const [d,m]=String(b).split('/').map(Number);const t=today();let y=t.getFullYear();if(new Date(y,m-1,d)<t)y++;return y+'-'+pad(m)+'-'+pad(d)}
function allEvents(){
 const c=custom.map(e=>e.yearly&&e.md?{...e,date:nextMD(e.md)}:e).filter(e=>e.date&&daysTo(e.date)>=0);
 return c.concat(U.map(u=>({id:'b-'+u.id,name:'Cumple de '+u.n,date:nextMD(u.b),type:'cumple',who:u.id}))).sort((a,b)=>a.date<b.date?-1:1)}
function isRev(i){return !!(i.claim&&i.claim.st==='done'&&i.claim.evDate&&daysTo(i.claim.evDate)<0)}
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- vistas ---------- */
function loginView(){
 return `<div class="stack"><h1>Lista de deseos</h1><p class="muted">Grupo «${esc(GROUP)}». Elegí tu nombre para entrar.</p></div>
 <div class="people">${U.map(u=>`<button class="card person" data-act="pick" data-id="${u.id}"><span class="row">${av(u.id)}<h2>${esc(u.n)}</h2></span><span class="muted small">${u.pin?'Entrar con PIN':'Primera vez: creá tu PIN'}</span></button>`).join('')}</div>
 <p class="muted small">Entrá solo con tu nombre. El PIN evita que otro vea qué te van a regalar.</p>`}

function evCard(e){const p=dparts(e.date);const sub=e.type==='cumple'?'Cumpleaños':e.type==='persona'?'Para '+esc(user(e.who).n):'Para todo el grupo';
 return `<button class="card" data-act="event" data-id="${esc(e.id)}"><span class="date"><b>${p.d}</b><span>${p.m}</span></span><span class="grow"><h2>${esc(e.name)}</h2><span class="muted small">${sub} · ${when(e.date)}</span></span></button>`}

function home(){
 const evs=allEvents(),shown=showAll?evs:evs.slice(0,4);
 const ppl=U.slice().sort((a,b)=>nextMD(a.b)<nextMD(b.b)?-1:1).map(u=>{const l=listOf(u.id);const free=l.filter(i=>!i.claim).length;const bp=dparts(nextMD(u.b));
  const sub=`Cumple ${bp.d} ${bp.m} · `+(u.id===me?`${l.length} deseos`:`${free} de ${l.length} sin regalar`);
  return `<button class="card person" data-act="list" data-id="${u.id}"><span class="row">${av(u.id)}<h2>${u.id===me?'Mi lista':esc(u.n)}</h2></span><span class="muted small">${sub}</span></button>`}).join('');
 return `<div class="stack"><h1>Hola, ${esc(user(me).n)}</h1><p class="muted">Grupo «${esc(GROUP)}» · ${U.length} personas</p></div>
 <section class="stack"><h2>Próximos eventos</h2>${shown.map(evCard).join('')}${evs.length>4?`<button class="btn wide" data-act="toggleAll">${showAll?'Ver menos':'Ver los '+evs.length+' eventos'}</button>`:''}<button class="btn wide" data-act="addEvent">Agregar un evento</button></section>
 <section class="stack"><h2>Listas del grupo</h2><div class="people">${ppl}</div></section>
 <button class="btn wide" data-act="share" data-kind="group">Invitar al grupo por WhatsApp</button>
 ${me===ADMIN?'<button class="btn wide" data-act="admin">Administrar PIN del grupo</button>':''}`}

function itemHTML(i,own){
 const u=safeUrl(i.url),img=safeImg(i.img);
 const sz=i.sized?(i.size?`<span class="sz">Talle: ${esc(i.size)}</span>`:`<span class="warnt">Falta el talle</span>`):'';
 const th=img?`<img src="${img}" alt="">`:esc((i.name||'?').trim()[0]||'?');
 let status='',acts='';
 if(own){acts=(i.sized&&!i.size?`<button class="btn pri" data-act="size" data-id="${i.id}">Cargar talle</button>`:'')+`<button class="btn" data-act="del" data-id="${i.id}">Quitar</button>`;if(isRev(i))status='<span class="pill free">Alguien te lo regaló</span>'}
 else if(!i.claim){status='<span class="pill free">Disponible</span>';acts=`<button class="btn pri" data-act="claim" data-id="${i.id}">Lo regalo yo</button>`}
 else{const c=i.claim,st=c.st,ms=c.members||[],mineC=c.pool?ms.includes(me):c.by===me;
  const who=c.pool?ms.map(m=>m===me?'vos':esc(user(m).n)).join(', '):(c.by===me?'vos':c.anon?'':esc(user(c.by).n));
  const lab=c.pool?(st==='done'?'Comprado en vaquita':'Vaquita'):(st==='done'?'Comprado':'Reservado');
  status=`<span class="pill ${st==='res'?'res':'done'}">${lab}${who?(c.pool?': ':' por ')+who:''}</span>`;
  if(mineC){
   if(st==='res')acts=`<button class="btn pri" data-act="bought" data-id="${i.id}">${c.pool?'Ya lo compramos':'Ya lo compré'}</button>`;
   acts+=`<button class="btn" data-act="release" data-id="${i.id}">${c.pool?'Salir de la vaquita':'Liberar'}</button>`;
  }else if(c.pool&&st==='res')acts=`<button class="btn pri" data-act="join" data-id="${i.id}">Sumarme a la vaquita</button>`}
 return `<article class="card item"><div class="thumb">${th}</div><div class="grow">
  <h3>${esc(i.name)}</h3>
  <div class="row small" style="flex-wrap:wrap;margin-top:4px">${sz}${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ver link</a>`:''}${status}</div>
  ${i.note?`<p class="muted small" style="margin-top:4px">${esc(i.note)}</p>`:''}
  <div class="acts">${acts}</div></div></article>`}

function list(id){
 const own=id===me,u=user(id),l=listOf(id);
 const head=`<div class="row">${av(id,true)}<div class="grow"><h1>${own?'Mi lista':'Lista de '+esc(u.n)}</h1><p class="muted small">${l.length} deseos</p></div></div>`;
 const info=own
  ?`<div class="note"><b>Acá no vas a ver qué te compraron.</b>Tus amigos ven quién reservó cada cosa. Recién al día siguiente del evento vas a ver qué te regalaron, sin saber quién.</div>`
  :`<div class="note"><b>${esc(u.n)} no ve nada de esto.</b>Las reservas y compras solo las ve el resto del grupo, para no regalar repetido.</div>`;
 const ng=own?l.filter(isRev).length:0;
 const gv=ng?`<div class="note"><b>Ya te regalaron ${ng} ${ng===1?'deseo':'deseos'} de tu lista.</b>Están marcados abajo. Quitalos cuando quieras.</div>`:'';
 const add=own?`<button class="btn pri wide" data-act="add">Agregar un deseo</button>`:'';
 const body=l.length?l.map(i=>itemHTML(i,own)).join(''):`<p class="muted">${own?'Tu lista está vacía. Agregá tu primer deseo.':esc(u.n)+' todavía no cargó deseos.'}</p>`;
 const share=!l.length?'':own?`<button class="btn wide" data-act="share" data-kind="list">Compartir mi lista con el grupo</button><button class="btn wide" data-act="share" data-kind="text" data-id="${id}">Enviar mi lista a alguien de afuera</button>`
  :`<button class="btn wide" data-act="share" data-kind="avail" data-id="${id}">Enviar lo disponible a alguien de afuera</button>`;
 return `${view.from?'<button class="back" data-act="back">‹ Volver</button>':''}${head}${info}${gv}${add}<div class="stack">${body}</div>${share}`}

function gifts(){
 const mine=items.filter(i=>i.claim&&(i.claim.pool?(i.claim.members||[]).includes(me):i.claim.by===me));
 const rows=mine.map(i=>{const o=user(i.owner);
  if(i.removed)return `<article class="card"><h3 style="font-family:var(--body);font-size:1rem">${esc(i.name)}</h3><p class="small warnt">${esc(o.n)} lo quitó de su lista. Revisá antes de comprar.</p><div class="acts"><button class="btn" data-act="release" data-id="${i.id}">Entendido, sacarlo</button></div></article>`;
  return `<div class="stack" style="gap:4px"><span class="muted small row">${av(o.id)} Para ${esc(o.n)}</span>${itemHTML(i,false)}</div>`}).join('');
 return `<div class="stack"><h1>Mis regalos</h1><p class="muted">Lo que te comprometiste a regalar. Solo lo ves vos.</p></div>
 ${mine.length?`<div class="stack" style="gap:16px">${rows}</div>`:'<p class="muted">Todavía no reservaste nada. Entrá a la lista de un amigo y tocá «Lo regalo yo».</p>'}`}

function eventView(id){
 const e=allEvents().find(x=>x.id===id);
 if(!e)return `<button class="back" data-act="go" data-v="home">‹ Inicio</button><p class="muted">Este evento ya no existe.</p>`;
 const p=dparts(e.date);let body='';
 if(e.type==='cumple'||e.type==='persona'){
  body=e.who===me?`<div class="note"><b>${e.type==='cumple'?'Es tu cumple.':'Este evento es para vos.'}</b>Mantené tu lista al día, que el grupo la está mirando.</div><button class="btn pri wide" data-act="go" data-v="mine">Ir a mi lista</button>`
   :`<button class="card" data-act="list" data-id="${esc(e.who)}" data-from="1">${av(e.who)}<span class="grow"><h2>Lista de ${esc(user(e.who).n)}</h2><span class="muted small">${listOf(e.who).filter(i=>!i.claim).length} deseos sin regalar</span></span></button>`}
 else{
  body=`<h2>¿A quién le regalás?</h2><div class="stack">${U.filter(u=>u.id!==me).map(u=>`<button class="card" data-act="list" data-id="${u.id}" data-from="1">${av(u.id)}<span class="grow"><b>${esc(u.n)}</b><br><span class="muted small">${listOf(u.id).filter(i=>!i.claim).length} deseos sin regalar</span></span></button>`).join('')}</div>`}
 const del=me===ADMIN&&e.type!=='cumple'?`<button class="btn wide" data-act="delEvent" data-id="${esc(e.id)}">Eliminar este evento</button>`:'';
 return `<button class="back" data-act="go" data-v="home">‹ Inicio</button>
 <div class="row"><span class="date"><b>${p.d}</b><span>${p.m}</span></span><div class="grow"><h1>${esc(e.name)}</h1><p class="muted small">${when(e.date)}</p></div></div>
 ${body}<button class="btn wide" data-act="share" data-kind="event" data-id="${esc(e.id)}">Compartir evento por WhatsApp</button>${del}`}

function render(nav){
 const m=$('#main'),logged=!!(me&&U.some(u=>u.id===me));let h='';
 if(err)h=`<div class="stack"><h1>No se pudo conectar</h1><p class="muted">${esc(err)}</p><button class="btn pri wide" data-act="reload">Reintentar</button></div>`;
 else if(!(ready.u&&ready.i&&ready.e))h='<p class="muted">Cargando las listas…</p>';
 else if(!logged)h=loginView();
 else if(view.v==='home')h=home();else if(view.v==='mine')h=list(me);else if(view.v==='list')h=list(view.id);
 else if(view.v==='gifts')h=gifts();else if(view.v==='event')h=eventView(view.id);
 const top=m.scrollTop;m.innerHTML=h;m.scrollTop=nav?0:top;
 const on=logged&&!err;$('#tabs').hidden=!on;$('#bar').hidden=!on;
 if(on)$('#who').textContent='Entraste como '+user(me).n;
 const tab=view.v==='list'&&view.id===me?'mine':view.v;
 document.querySelectorAll('#tabs button').forEach(b=>{if(b.dataset.v===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}

/* ---------- hojas ---------- */
function closeSheet(){$('#overlay').innerHTML='';photo=''}
function sheet(inner,label,form){$('#overlay').innerHTML=`<div class="sheet-bg" data-act="close"><${form?`form id="${form}"`:'div'} class="sheet" role="dialog" aria-label="${label}">${inner}</${form?'form':'div'}></div>`}
const cancel=t=>`<button class="btn wide" type="button" data-act="close" data-force="1">${t||'Cancelar'}</button>`;
function pinSheet(u){pinFor=u;const first=!u.pin;
 sheet(`<h2>${first?'Creá tu PIN, '+esc(u.n):'Hola, '+esc(u.n)}</h2>
 <p class="muted small">${first?'Elegí 4 números que recuerdes. Te los vamos a pedir cada vez que entres desde un dispositivo nuevo.':'Ingresá tu PIN de 4 números.'}</p>
 <label class="field" for="p-pin">PIN<input id="p-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off" placeholder="4 números"></label>
 <button class="btn pri wide" type="submit">${first?'Guardar PIN y entrar':'Entrar'}</button>
 ${first?'':`<p class="muted small">¿Lo olvidaste? Pedile a ${esc(user(ADMIN).n)} que lo reinicie.</p>`}${cancel()}`,'Ingresar','pinForm');$('#p-pin').focus()}
function addSheet(){
 sheet(`<h2>Agregar un deseo</h2>
 <label class="field" for="f-name">¿Qué querés?<input id="f-name" required maxlength="80" placeholder="Ej.: Zapatillas para correr"></label>
 <label class="field" for="f-url">Link (opcional)<input id="f-url" inputmode="url" maxlength="600" placeholder="Pegá el link de la tienda"></label>
 <label class="row" for="f-sized" style="font-weight:600;font-size:.88rem"><input id="f-sized" type="checkbox"> Es ropa, calzado o algo con talle</label>
 <label class="field" for="f-size" id="f-size-wrap" hidden>Talle o medidas (obligatorio)<input id="f-size" maxlength="40" placeholder="Ej.: 37, M, 90 x 60 cm"></label>
 <label class="field" for="f-note">Nota (opcional)<input id="f-note" maxlength="160" placeholder="Color, modelo, aclaraciones"></label>
 <label class="field" for="f-img">Foto (opcional)<input id="f-img" type="file" accept="image/*"></label>
 <button class="btn pri wide" type="submit">Guardar en mi lista</button>${cancel()}`,'Agregar un deseo','addForm');
 sizedTouched=false;$('#f-name').focus()}
function evSheet(){
 sheet(`<h2>Agregar un evento</h2>
 <label class="field" for="e-name">Nombre<input id="e-name" required maxlength="60" placeholder="Ej.: Despedida de Luis, Día del amigo"></label>
 <label class="field" for="e-date">Fecha<input id="e-date" type="date" required></label>
 <label class="field" for="e-who">¿Para quién son los regalos?<select id="e-who"><option value="">Todo el grupo</option>${U.map(u=>`<option value="${u.id}">${esc(u.n)}</option>`).join('')}</select></label>
 <label class="row" for="e-year" style="font-weight:600;font-size:.88rem"><input id="e-year" type="checkbox"> Se repite todos los años</label>
 <button class="btn pri wide" type="submit">Crear evento</button>${cancel()}`,'Agregar un evento','evForm');$('#e-name').focus()}
const RX=/zapat|botas?\b|botin|jean|remera|camis|pantal|campera|buzo|vestido|pollera|short|medias|ropa|sweater|su[eé]ter|abrigo|anillo|cintur|malla|bikini|corpi|pijama|ojotas|sandalia|chomba|musculosa|calza|gorra/i;
function syncSize(){const c=$('#f-sized').checked;$('#f-size-wrap').hidden=!c;$('#f-size').required=c}
function sizeSheet(it){sizeFor=it;
 sheet(`<h2>Cargar talle o medidas</h2><p class="muted small">${esc(it.name)}</p>
 <label class="field" for="s-size">Talle o medidas<input id="s-size" required maxlength="40" placeholder="Ej.: 37, M, 90 x 60 cm"></label>
 <button class="btn pri wide" type="submit">Guardar</button>${cancel()}`,'Cargar talle','sizeForm');$('#s-size').focus()}
function claimSheet(it){
 const o=esc(user(it.owner).n);
 const opts=allEvents().filter(e=>!e.who||e.who===it.owner).map(e=>{const p=dparts(e.date);return `<option value="${esc(e.date)}">${esc(e.name)} · ${p.d} ${p.m}</option>`}).join('');
 sheet(`<h2>¿Cómo querés reservarlo?</h2>
 <p class="muted small">${esc(it.name)}. ${o} se entera recién al día siguiente del evento, y sin saber quién fue.</p>
 <label class="field" for="c-ev">¿Para qué evento es?<select id="c-ev">${opts}</select></label>
 <button class="btn pri wide" data-act="claimName" data-id="${it.id}">Con mi nombre: el grupo ve que fui yo</button>
 <button class="btn wide" data-act="claimAnon" data-id="${it.id}">Anónimo: el grupo solo ve «Reservado»</button>
 <button class="btn wide" data-act="claimPool" data-id="${it.id}">Vaquita: otros se pueden sumar</button>${cancel()}`,'Reservar regalo')}
function shareSheet(kind,id){
 const link=location.href.split('#')[0].split('?')[0];let t;
 if(kind==='list')t=`Les paso mi lista de deseos, por si no saben qué regalarme:\n${link}\nMarquen lo que compren, que yo no lo veo.`;
 else if(kind==='text'||kind==='avail'){
  const own=kind==='text',src=listOf(id).filter(i=>own||!i.claim);
  const lines=src.map(i=>'• '+i.name+(i.sized&&i.size?' (talle '+i.size+')':'')+(i.note?' — '+i.note:'')+(safeUrl(i.url)?'\n'+i.url:'')).join('\n\n');
  t=own?`Mi lista de deseos:\n\n${lines}`
   :src.length?`Lista de deseos de ${user(id).n}. Esto es lo que todavía nadie reservó:\n\n${lines}\n\nSi vas a regalar algo, avisame así lo marco y no se repite.`
   :`Por ahora todo lo de la lista de ${user(id).n} ya está reservado.`}
 else if(kind==='event'){const e=allEvents().find(x=>x.id===id);const p=dparts(e.date);t=`${e.name}, el ${p.d} de ${p.m}.\nMiren las listas y marquen qué regala cada uno:\n${link}`}
 else t=`Armé las listas de deseos del grupo. Cada uno carga lo que quiere y el resto marca qué regala, sin que el dueño se entere:\n${link}\nEntren con su nombre y creen su PIN.`;
 sheet(`<h2>Compartir por WhatsApp</h2><pre class="msg" id="msg">${esc(t)}</pre>
 <a class="btn wa wide" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">Abrir WhatsApp con este mensaje</a>
 <button class="btn wide" data-act="copy">Copiar mensaje</button>${cancel('Cerrar')}`,'Compartir por WhatsApp')}
function adminSheet(){
 sheet(`<h2>PIN del grupo</h2><p class="muted small">El botón «Reiniciar» aparece solo en quienes ya crearon su PIN. Al reiniciarlo, esa persona crea uno nuevo la próxima vez que entra.</p>
 <div class="stack">${U.map(u=>`<div class="row between"><span>${esc(u.n)} <span class="muted small">· ${u.pin?'con PIN':'sin PIN'}</span></span>${u.pin?`<button class="btn" data-act="resetPin" data-id="${u.id}">${u.id===me?'Cambiar mi PIN':'Reiniciar'}</button>`:''}</div>`).join('')}</div>${cancel('Cerrar')}`,'Administrar PIN')}

function toThumb(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
 im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}

/* ---------- acciones ---------- */
const ref=id=>doc(db,'items',id);
async function claim(it,extra){
 const evDate=($('#c-ev')||{}).value||'';closeSheet();
 const c={by:me,st:'res',anon:false,evDate,...extra};
 try{await runTransaction(db,async t=>{const d=await t.get(ref(it.id));if(!d.exists()||d.data().claim||d.data().removed)throw new Error('taken');t.update(ref(it.id),{claim:c})})}
 catch(e){if(e.message==='taken'){toast('Alguien lo reservó recién.');return}throw e}
 toast(c.pool?'Vaquita abierta. Avisale al grupo para que se sumen.':c.anon?'Reservado en modo anónimo.':'Reservado. '+user(it.owner).n+' no se entera.')}

document.addEventListener('click',async ev=>{
 const el=ev.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,it=items.find(i=>i.id===id);
 try{
  if(a==='close'){if(el.dataset.force||ev.target===el)closeSheet();return}
  if(a==='reload'){location.reload();return}
  if(a==='pick'){pinSheet(user(id));return}
  if(a==='logout'){me='';try{localStorage.removeItem('wl_me')}catch(e){}view={v:'home'};render(true);return}
  if(a==='go'){view={v:el.dataset.v};render(true);return}
  if(a==='event'){view={v:'event',id};render(true);return}
  if(a==='list'){view={v:'list',id,from:el.dataset.from?view:{v:'home'}};render(true);return}
  if(a==='back'){view=view.from||{v:'home'};render(true);return}
  if(a==='toggleAll'){showAll=!showAll;render();return}
  if(a==='add'){addSheet();return}
  if(a==='addEvent'){evSheet();return}
  if(a==='admin'){adminSheet();return}
  if(a==='share'){shareSheet(el.dataset.kind,id);return}
  if(a==='copy'){try{await navigator.clipboard.writeText($('#msg').textContent);toast('Mensaje copiado.')}catch(e){toast('No se pudo copiar. Mantené apretado el texto para copiarlo.')}return}
  if(a==='resetPin'){if(me!==ADMIN)return;await updateDoc(doc(db,'users',id),{pin:deleteField()});closeSheet();
   if(id===me){me='';try{localStorage.removeItem('wl_me')}catch(e){}view={v:'home'};render(true);toast('Elegí tu nombre y creá tu PIN nuevo.')}else toast('PIN de '+user(id).n+' reiniciado.');return}
  if(a==='delEvent'){if(me!==ADMIN)return;await deleteDoc(doc(db,'events',id));view={v:'home'};render(true);toast('Evento eliminado.');return}
  if(!it)return;
  if(a==='claim'){claimSheet(it);return}
  if(a==='claimName'){await claim(it,{});return}
  if(a==='claimAnon'){await claim(it,{anon:true});return}
  if(a==='claimPool'){await claim(it,{pool:true,members:[me]});return}
  if(a==='join'){if(it.claim&&it.claim.pool){await updateDoc(ref(id),{'claim.members':arrayUnion(me)});toast('Te sumaste a la vaquita.')}return}
  if(a==='bought'){await updateDoc(ref(id),{'claim.st':'done'});toast('Marcado como comprado.');return}
  if(a==='release'){const c=it.claim;if(!c)return;
   const drop=async()=>{if(it.removed)await deleteDoc(ref(id));else await updateDoc(ref(id),{claim:null});toast('Liberado para el resto del grupo.')};
   if(c.pool){const ms=(c.members||[]).filter(m=>m!==me);if(ms.length){await updateDoc(ref(id),{'claim.members':ms,'claim.by':ms[0]});toast('Saliste de la vaquita.')}else await drop()}
   else if(c.by===me)await drop();return}
  if(a==='size'){if(it.owner===me)sizeSheet(it);return}
  if(a==='del'){if(it.owner!==me)return;if(it.claim&&!isRev(it))await updateDoc(ref(id),{removed:true});else await deleteDoc(ref(id));toast('Quitado de tu lista.');return}
 }catch(e){console.error(e);toast('No se pudo guardar. Revisá tu conexión e intentá de nuevo.')}});

document.addEventListener('change',async ev=>{
 if(ev.target.id==='f-sized'){sizedTouched=true;syncSize()}
 if(ev.target.id==='f-img'){const f=ev.target.files[0];photo='';if(!f)return;try{photo=await toThumb(f)}catch(e){toast('No se pudo leer la foto. Probá con otra.')}}});
document.addEventListener('input',ev=>{if(ev.target.id==='f-name'&&!sizedTouched){$('#f-sized').checked=RX.test(ev.target.value);syncSize()}});

document.addEventListener('submit',async ev=>{
 ev.preventDefault();const f=ev.target.id;
 try{
  if(f==='pinForm'){const u=pinFor,pin=$('#p-pin').value.trim();if(!u||!/^[0-9]{4}$/.test(pin)){toast('El PIN tiene que tener 4 números.');return}
   const h=await sha(u.id+':'+pin),cur=user(u.id);
   if(cur.pin){if(cur.pin!==h){toast('PIN incorrecto. Probá de nuevo.');$('#p-pin').value='';return}}
   else await updateDoc(doc(db,'users',u.id),{pin:h});
   me=u.id;try{localStorage.setItem('wl_me',me)}catch(e){}closeSheet();view={v:'home'};render(true);return}
  if(f==='addForm'){const name=$('#f-name').value.trim();if(!name)return;
   let url=$('#f-url').value.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
   const sized=$('#f-sized').checked,size=sized?$('#f-size').value.trim():'';if(sized&&!size){toast('Cargá el talle o las medidas.');return}
   const img=photo,note=$('#f-note').value.trim();closeSheet();
   await addDoc(collection(db,'items'),{owner:me,name,url,note,sized,size,img,claim:null,removed:false,ts:Date.now()});
   view={v:'mine'};render(true);toast('Agregado a tu lista.');return}
  if(f==='evForm'){const name=$('#e-name').value.trim(),date=$('#e-date').value,who=$('#e-who').value,yearly=$('#e-year').checked;if(!name||!date)return;
   const [y,m,d]=date.split('-');closeSheet();
   const r=await addDoc(collection(db,'events'),{name,date,type:who?'persona':'fiesta',who,yearly,md:d+'/'+m});
   view={v:'event',id:r.id};render(true);toast('Evento creado.');return}
  if(f==='sizeForm'){const v=$('#s-size').value.trim();if(!v||!sizeFor)return;const id=sizeFor.id;closeSheet();await updateDoc(ref(id),{size:v});toast('Talle guardado.');return}
 }catch(e){console.error(e);toast('No se pudo guardar. Revisá tu conexión e intentá de nuevo.')}});

/* ---------- datos ---------- */
async function seed(){
 const b=writeBatch(db),base=Date.now();
 SEED_USERS.forEach(([n,bd],i)=>b.set(doc(db,'users',n.toLowerCase()),{n,b:bd,order:i}));
 SEED_ITEMS.forEach(([name,url,note,size],i)=>b.set(doc(collection(db,'items')),{owner:'daniela',name,url,note,sized:size!==undefined,size:size||'',img:'',claim:null,removed:false,ts:base+i}));
 b.set(doc(db,'events','navidad'),{name:'Navidad',date:'2026-12-24',type:'fiesta',who:'',yearly:true,md:'24/12'});
 b.set(doc(db,'meta','init'),{at:base});
 await b.commit()}
const fail=e=>{console.error(e);err='Revisá tu conexión. Si es la primera vez, falta crear la base de datos Firestore o publicar sus reglas.';render()};
async function start(){
 render();
 try{const m=await getDoc(doc(db,'meta','init'));if(!m.exists())await seed()}catch(e){fail(e);return}
 onSnapshot(collection(db,'users'),s=>{U=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)).map((u,i)=>({...u,c:PAL[i%PAL.length]}));ready.u=true;render()},fail);
 onSnapshot(collection(db,'items'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));ready.i=true;render()},fail);
 onSnapshot(collection(db,'events'),s=>{custom=s.docs.map(d=>({id:d.id,...d.data()}));ready.e=true;render()},fail)}
start();
</script>
</body>
